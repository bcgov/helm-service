{{- if and .Values.pvc .Values.pvc.enabled }}
{{- $pvcName := include "component.fullname" . }}
{{- if .Values.pvc.nameOverride }}
{{- $pvcName = tpl .Values.pvc.nameOverride $ }}
{{- end }}

{{- $existingPVC := lookup "v1" "PersistentVolumeClaim" .Release.Namespace $pvcName }}

{{- if not $existingPVC }}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  {{- if .Values.pvc.nameOverride }}
  name: {{ tpl .Values.pvc.nameOverride $}}
  {{- else }}
  name: {{ include "component.fullname" . }}
  {{- end }}
  {{- if .Values.pvc.persist }}
  annotations:
    helm.sh/resource-policy: "keep"
  {{- end }}
  labels:
    {{- include "component.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.pvc.accessModes }}
  resources:
    requests:
      storage: {{ .Values.pvc.size }}
  storageClassName: {{ .Values.pvc.storageClassName }}
{{- end }}
{{- end }}
